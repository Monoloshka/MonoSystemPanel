[package]
name = "monosystempanel"
version = "0.1.0"
edition = "2021"
authors = ["Dmitriy Yakovenko (Monoloshka)"]
description = "MonoSystemPanel: управление устройствами по SSH"
license = "MIT"

[lib]
name = "monosystempanel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"
tokio = { version = "1", features = ["time", "sync", "net"] }
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
tauri-plugin-opener = "2"

# Меньше размер файла, RAM и нагрузка на процессор при том же поведении программы
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
