name: Дополнительные форматы (не проверены)

# Запускается только вручную: Actions → эта сборка → Run workflow → отметьте нужное.
# Эти форматы не проверяются автором, их выкладывают «как есть» для тех, кому они нужны.
on:
  workflow_dispatch:
    inputs:
      msi:
        description: Windows .msi
        type: boolean
        default: false
      rpm:
        description: Linux .rpm (Fedora, openSUSE)
        type: boolean
        default: false
      linux_arm64:
        description: Linux ARM64 (.deb и .AppImage)
        type: boolean
        default: false
      macos:
        description: macOS .app и .dmg (Intel и Apple Silicon)
        type: boolean
        default: false
      android_all:
        description: Android для всех процессоров (arm64, armv7, x86, x86_64)
        type: boolean
        default: false

jobs:
  msi:
    if: ${{ inputs.msi }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --bundles msi
      - uses: actions/upload-artifact@v4
        with: { name: windows-msi, path: src-tauri/target/release/bundle/msi/*.msi }

  rpm:
    if: ${{ inputs.rpm }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --bundles rpm
      - uses: actions/upload-artifact@v4
        with: { name: linux-rpm, path: src-tauri/target/release/bundle/rpm/*.rpm }

  linux_arm64:
    if: ${{ inputs.linux_arm64 }}
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

  android_all:
    if: ${{ inputs.android_all }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android" }
      - run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
      - run: npm install
      - run: npx tauri icon app-icon.svg
      - run: npx tauri android init
      - run: npx tauri icon app-icon.svg
      - run: npx tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with: { name: android-all-abi, path: "src-tauri/gen/android/app/build/outputs/apk/**/*.apk" }
