<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MonoSystemPanel</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1b1f24;--card:#f3f5f8;--line:#d0d7de;--acc:#2563eb;--err:#dc2626;--ok:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6edf3;--card:#1a2029;--line:#303944;--acc:#4c8dff;--ok:#3fb950}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
main{max-width:860px;margin:0 auto;padding:16px}
h1{margin:.3em 0 .2em;font-size:1.4em}
.langbar{display:flex;gap:6px;align-items:center;margin-bottom:6px}.langbar select{width:auto;max-width:70%}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;min-width:0}
label{display:block;margin:8px 0 2px;font-size:.9em;opacity:.8}
input,select,textarea{width:100%;max-width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
textarea{resize:vertical;min-height:6em}
input::placeholder,textarea::placeholder{color:var(--fg);opacity:.35}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;cursor:pointer;margin:6px 6px 0 0}
button.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.35;cursor:default}
button.sm{padding:3px 8px;margin:1px;font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.fav{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.fav:last-child{border:0}.fav b{cursor:pointer}.fav small{opacity:.7;display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}
.tabs button{background:transparent;color:var(--fg);border:1px solid var(--line);white-space:nowrap;margin:0}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
pre{background:#000;color:#cfe;padding:10px;border-radius:8px;overflow:auto;white-space:pre-wrap;max-height:50vh;margin:8px 0 0}
progress{width:100%;height:20px}
table{border-collapse:collapse;width:100%;font-size:.88em}th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.err{color:var(--err)}.ok{color:var(--ok)}.hint{font-size:.85em;opacity:.75;margin:4px 0}.hide{display:none}
.adbox{text-align:center;margin:22px 0 6px;min-height:1px}
.adbox img{max-width:100%;height:auto;border-radius:6px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.adbox a{display:inline-block}
footer{text-align:center;margin:18px 0 8px}footer a{color:var(--acc);cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);max-width:min(92vw,720px)}
dialog pre{max-height:55vh}
.about{text-align:center}.about img{width:128px;height:128px}.about h2{margin:.3em 0 0}
.linkrow{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0;flex-wrap:wrap}.linkrow span{opacity:.8}.linkrow a{color:var(--acc);cursor:pointer;word-break:break-all}.linkrow svg{width:18px;height:18px;flex:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:.9em}
</style>
</head>
<body>
<main>
  <h1 data-i18n="title"></h1>
  <div class="langbar"><select id="lang"></select><button id="lang-add" class="sec sm" title="">＋</button></div>
  <input id="lang-in" type="file" accept=".json" class="hide">

  <section id="login">
    <div class="card"><b data-i18n="fav"></b><div id="favs"></div></div>
    <div class="card">
      <div class="row">
        <div><label data-i18n="name"></label><input id="f-name" placeholder="OpenWrt"></div>
        <div><label data-i18n="host"></label><input id="f-host" placeholder="192.168.1.1" autocapitalize="off" autocomplete="off"></div>
      </div>
      <div class="row">
        <div><label data-i18n="port"></label><input id="f-port" type="number" value="22"></div>
        <div><label data-i18n="user"></label><input id="f-user" value="root" autocapitalize="off"></div>
      </div>
      <label data-i18n="pass"></label>
      <input id="f-pass" type="password" autocomplete="current-password">
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-show" style="width:auto"><span data-i18n="show_pass"></span></label>
      <details><summary data-i18n="key_opt"></summary>
        <label data-i18n="key_path"></label><input id="f-key" placeholder="/home/user/.ssh/id_ed25519"></details>
      <details><summary data-i18n="dns"></summary>
        <input id="f-dns" placeholder="1.1.1.1" autocapitalize="off"><div class="hint" data-i18n="dns_hint"></div></details>
      <button id="b-connect" data-i18n="connect"></button>
      <button id="b-save" class="sec" data-i18n="add_fav"></button>
      <div id="login-err"></div>
    </div>
  </section>

  <section id="appscr" class="hide">
    <div class="row" style="align-items:center">
      <div id="who"></div>
      <select id="app-pick"></select>
      <div><button id="b-edit" class="sec" data-i18n="editor"></button><button id="b-file" class="sec" data-i18n="open_file"></button><button id="b-out" class="sec" data-i18n="logout"></button></div>
    </div>
    <div id="editor" class="card hide">
      <b data-i18n="ed_title"></b>
      <div class="hint" data-i18n="ed_hint"></div>
      <label data-i18n="ed_name"></label><input id="ed-name">
      <label data-i18n="ed_text"></label><textarea id="ed-text" rows="16" spellcheck="false" style="font-family:monospace"></textarea>
      <button id="ed-save" data-i18n="ed_save"></button><button id="ed-close" class="sec" data-i18n="close"></button><button id="ed-del" class="sec" data-i18n="ed_del"></button>
    </div>
    <input id="file-in" type="file" accept=".yaml,.yml,.txt" class="hide">
    <div id="tabs" class="tabs"></div>
    <div id="page"></div>
  </section>

  <div id="ad" class="adbox"></div>

  <footer class="hint">MonoSystemPanel · <a id="b-about" data-i18n="about_btn"></a> · <a id="b-help" data-i18n="help_btn"></a></footer>
</main>

<dialog id="dlg"><p id="dlg-text" style="white-space:pre-wrap"></p><button id="dlg-yes"></button><button id="dlg-no" class="sec"></button></dialog>
<dialog id="help"><b id="help-title"></b><pre id="help-text"></pre><button id="help-close" class="sec"></button></dialog>
<dialog id="rb"><p id="rb-msg"></p><button id="rb-cancel" class="sec"></button></dialog>
<dialog id="about">
  <div class="about">
    <img src="icon.svg" alt="">
    <h2 id="about-name"></h2>
    <div class="hint" id="about-ver"></div>
    <p><span data-i18n="author"></span>: <b id="about-author"></b></p>
    <b data-i18n="links"></b>
    <div id="about-links"></div>
  </div>
  <b data-i18n="license"></b>
  <pre id="about-lic"></pre>
  <p class="hint" id="about-ai" style="text-align:center"></p>
  <button id="about-close" class="sec" data-i18n="close"></button>
</dialog>
<div id="toast" class="hide"></div>

<script src="ads.js"></script>
<script src="about.js"></script>
<script>
const {invoke}=window.__TAURI__.core;
const $=s=>document.querySelector(s);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const[a,v]of Object.entries(p)){if(a==='class')e.className=v;else if(a.startsWith('on'))e.addEventListener(a.slice(2),v);else e.setAttribute(a,v)}e.append(...k);return e};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const asList=x=>x==null?[]:Array.isArray(x)?x:[x];
let favs=load('favs',[]),fps=load('fps',{}),apps=load('apps',{}),doc=null,vpages=[],curPage=0,sess=null;
const UNITS={B:1,KB:1024,MB:1048576,GB:1073741824};

/* ---------- языки (файлы lang/*.json + свои, добавленные пользователем) ---------- */
let LANGS={},lang=load('lang',null);
const t=(k,...a)=>{let s=LANGS[lang]?.strings?.[k]??LANGS.ru?.strings?.[k]??k;a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)});return s};
async function initLangs(){
  try{for(const c of await (await fetch('lang/index.json')).json())LANGS[c]=await (await fetch(`lang/${c}.json`)).json()}catch{}
  Object.assign(LANGS,load('customLangs',{}));
  if(!lang||!LANGS[lang]){lang=(navigator.language||'ru').slice(0,2);if(!LANGS[lang])lang='ru'}
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  $('#lang-add').title=t('lang_add');$('#dlg-yes').textContent=t('yes');$('#dlg-no').textContent=t('no');
  $('#help-title').textContent=t('help_title');$('#help-text').textContent=t('help_text');$('#help-close').textContent=t('close');$('#rb-cancel').textContent=t('rb_cancel');
  const sel=$('#lang');sel.replaceChildren();
  Object.entries(LANGS).forEach(([c,l])=>sel.append(el('option',{value:c},`${l.flag||''} ${l.name||c}`)));sel.value=lang;
  renderFavs();
  if(!$('#appscr').classList.contains('hide'))refreshPick($('#app-pick').value);
}
$('#lang').onchange=e=>{lang=e.target.value;save('lang',lang);applyLang()};
$('#lang-add').onclick=()=>$('#lang-in').click();
$('#lang-in').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const j=JSON.parse(await f.text());if(!j.strings)throw 0;const code=(j.code||f.name.replace(/\.json$/,'')).toLowerCase();
    const c=load('customLangs',{});c[code]={name:j.name||code,flag:j.flag||'',strings:j.strings};save('customLangs',c);LANGS[code]=c[code];lang=code;save('lang',lang);applyLang()}
  catch{alert(t('lang_bad'))}};
$('#b-help').onclick=()=>$('#help').showModal();$('#help-close').onclick=()=>$('#help').close();

/* ---------- перевод сообщений об ошибках ---------- */
function osText(d,plain){
  d=String(d||'');
  if(/lookup|no address associated|name or service|nodename|not known|os error 11001/i.test(d))return t('err_nodns');
  if(/unreachable|os error (101|10051)/i.test(d))return t('err_unreach');
  if(/refused|os error (111|10061)/i.test(d))return t('err_refused');
  if(/no route|os error (113|10065)/i.test(d))return t('err_noroute');
  if(/timed out|timeout|os error (110|10060)/i.test(d))return t('err_timeout');
  if(/channel|disconnect|broken pipe|reset|aborted|eof|closed|os error (32|103|104|10053|10054)/i.test(d))return t('err_lost');
  return plain?d:t('err_generic',d);
}
function errMsg(e){
  e=String(e??'').replace(/^Error:\s*/,'');
  if(e.startsWith('E_')){
    const [c,...a]=e.split('|');
    switch(c){
      case'E_NO_SESSION':return t('err_nosession');case'E_CONNECT_TIMEOUT':return t('err_ctimeout');case'E_AUTH':return t('err_auth');case'E_CMD_TIMEOUT':return t('err_cmdtimeout');
      case'E_DNS_ADDR':return t('err_dnsaddr',a[0]);case'E_DNS':return t('err_dns',a[0],a[1],osText(a.slice(2).join('|'),true));
      case'E_RESOLVE':return t('err_resolve',a[0]);case'E_CONNECT':return t('err_connect',osText(a.join('|')));case'E_KEY':return t('err_key',a.join('|'));
    }
  }
  return osText(e);
}

function ask(text){return new Promise(res=>{const d=$('#dlg');$('#dlg-text').textContent=text;
  const done=v=>{d.close();res(v)};$('#dlg-yes').onclick=()=>done(true);$('#dlg-no').onclick=()=>done(false);d.showModal()})}
const openUrl=u=>window.__TAURI__.opener.openUrl(u);
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2000)}
function copyText(s){
  const fb=()=>{const ta=el('textarea',{style:'position:fixed;opacity:0'});ta.value=s;document.body.append(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove()};
  try{navigator.clipboard.writeText(s).catch(fb)}catch{fb()}
}

/* ---------- О программе ---------- */
const GLOBE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>';
$('#b-about').onclick=async()=>{
  $('#about-name').textContent=ABOUT.name;$('#about-author').textContent=ABOUT.author;
  let v='';try{v=await window.__TAURI__.app.getVersion()}catch{}$('#about-ver').textContent=v?t('version',v):'';
  const box=$('#about-links');box.replaceChildren();
  for(const l of ABOUT.links||[]){
    if(!/^https:\/\//.test(l.url))continue;
    const tx=typeof l.text==='object'?(l.text[lang]||l.text.en||Object.values(l.text)[0]):l.text;
    const ic=l.icon?el('img',{src:l.icon,width:18,height:18}):el('span');if(!l.icon)ic.innerHTML=GLOBE;
    box.append(el('div',{class:'linkrow'},el('span',{},tx||''),ic,el('a',{onclick:()=>openUrl(l.url)},l.url.replace(/^https:\/\//,''))));
  }
  $('#about-lic').textContent=LICENSE_TEXT;$('#about-ai').textContent=t('created_ai');$('#about').showModal();
};
$('#about-close').onclick=()=>$('#about').close();

/* ---------- избранное и вход ---------- */
function renderFavs(){
  const box=$('#favs');box.replaceChildren();
  if(!favs.length){box.append(el('small',{},t('empty')));return}
  favs.forEach((f,i)=>box.append(el('div',{class:'fav'},
    el('div',{},el('b',{onclick:()=>fill(f)},f.name||f.host),el('small',{},`${f.user}@${f.host}:${f.port}`+(f.dns?` · DNS ${f.dns}`:''))),
    el('button',{class:'sec',onclick:()=>{favs.splice(i,1);save('favs',favs);renderFavs()}},t('del')))));
}
function fill(f){$('#f-name').value=f.name||'';$('#f-host').value=f.host;$('#f-port').value=f.port;$('#f-user').value=f.user;$('#f-dns').value=f.dns||'';$('#f-pass').focus()}
function formData(){return{name:$('#f-name').value.trim(),host:$('#f-host').value.trim().replace(/^\[|\]$/g,''),port:+$('#f-port').value||22,user:$('#f-user').value.trim(),dns:$('#f-dns').value.trim()}}
$('#f-show').onchange=e=>{$('#f-pass').type=e.target.checked?'text':'password'};
$('#b-save').onclick=()=>{
  const f=formData();if(!f.host||!f.user){$('#login-err').className='err';$('#login-err').textContent=t('need_host');return}
  const i=favs.findIndex(x=>x.host===f.host&&x.port===f.port&&x.user===f.user);
  if(i>=0)favs[i]=f;else favs.push(f);save('favs',favs);renderFavs();$('#login-err').textContent='';
};

async function tryConnect(f,pw,key,err){
  const fail=m=>{if(err){err.className='err';err.textContent=m}return false};
  if(err){err.className='';err.textContent=t('connecting')}
  if(!f.host||!f.user)return fail(t('need_host'));
  const id=`${f.host}:${f.port}`;let trust=false;
  for(let i=0;i<2;i++){
    try{
      const fp=await invoke('connect',{host:f.host,port:f.port,user:f.user,password:pw,keyPath:key||null,knownFp:fps[id]||null,trust,dns:f.dns||null});
      fps[id]=fp;save('fps',fps);if(err)err.textContent='';return true;
    }catch(e){
      e=String(e);
      if(e.startsWith('KEY:')){
        const [,kind,...r]=e.split(':'),fp=r.join(':');
        if(!(await ask(kind==='CHANGED'?t('key_changed',id,fp):t('key_new',id,fp))))return fail(t('cancelled'));
        trust=true;continue;
      }
      return fail(errMsg(e));
    }
  }
  return false;
}
$('#b-connect').onclick=async()=>{
  const f=formData(),pw=$('#f-pass').value,key=$('#f-key').value.trim();
  if(await tryConnect(f,pw,key,$('#login-err'))){sess={f,pw,key};$('#f-pass').value='';enterApp(f)}
};

/* ---------- экран приложения ---------- */
async function enterApp(f){
  cmdCache.clear();
  $('#login').classList.add('hide');$('#appscr').classList.remove('hide');
  $('#who').textContent=`${f.user}@${f.host}`;await refreshPick();
}
function backToLogin(){sess=null;$('#appscr').classList.add('hide');$('#login').classList.remove('hide');showAd()}
async function appText(name){return name==='@example'?await (await fetch('example.yaml')).text():apps[name]}
async function refreshPick(sel){
  const pick=$('#app-pick');pick.replaceChildren(el('option',{value:'@example'},t('example')));
  Object.keys(apps).forEach(n=>pick.append(el('option',{value:n},n)));
  if(sel&&[...pick.options].some(o=>o.value===sel))pick.value=sel;
  await openApp(pick.value);
}
async function openApp(name){
  try{doc=await invoke('parse_yaml',{text:await appText(name)})}
  catch(e){doc=null;vpages=[];$('#tabs').replaceChildren();$('#page').replaceChildren(el('div',{class:'err'},t('bad_yaml',errMsg(e))));showAd();return}
  try{await ensureCmds(collectTokens(doc))}catch{}
  vpages=(doc.pages||[]).filter(pageVisible);curPage=0;renderTabs();renderPage();
}
$('#app-pick').onchange=e=>openApp(e.target.value);
$('#b-file').onclick=()=>$('#file-in').click();
$('#file-in').onchange=async e=>{const f=e.target.files[0];if(!f)return;apps[f.name]=await f.text();save('apps',apps);e.target.value='';refreshPick(f.name)};
$('#b-out').onclick=async()=>{try{await invoke('disconnect')}catch{}backToLogin()};
$('#b-edit').onclick=async()=>{const n=$('#app-pick').value;
  $('#ed-name').value=n==='@example'?'my-device.yaml':n;$('#ed-text').value=await appText(n);$('#editor').classList.remove('hide')};
$('#ed-close').onclick=()=>$('#editor').classList.add('hide');
$('#ed-save').onclick=async()=>{const n=$('#ed-name').value.trim();if(!n)return;apps[n]=$('#ed-text').value;save('apps',apps);$('#editor').classList.add('hide');await refreshPick(n)};
$('#ed-del').onclick=async()=>{const n=$('#ed-name').value.trim();if(apps[n]&&await ask(t('del_q',n))){delete apps[n];save('apps',apps);$('#editor').classList.add('hide');await refreshPick()}};

function renderTabs(){
  const tb=$('#tabs');tb.replaceChildren();
  vpages.forEach((p,i)=>tb.append(el('button',{class:i===curPage?'on':'',onclick:()=>{curPage=i;renderTabs();renderPage()}},p.title||('#'+(i+1)))));
}

/* ---------- проверка, что нужные команды есть на устройстве ---------- */
const cmdCache=new Map();
const okTok=s=>/^[A-Za-z0-9._+-]+$/.test(s)||/^\/[A-Za-z0-9._\/+-]+$/.test(s);
const SKIP=new Set(['for','if','while','until','case','echo','printf','test','true','false','cd','exit','read','set','export','unset','eval','exec','command','kill','wait','trap','type','[','[[','{','(','!']);
function firstWord(cmd){const w=String(cmd??'').trim().split('\n')[0].trim().split(/\s+/)[0];return(w&&okTok(w)&&!SKIP.has(w))?w:null}
function autoTokens(steps){const out=[];const walk=l=>asList(l).forEach(st=>{const o=typeof st==='string'?{cmd:st}:st;if(!o)return;const w=firstWord(o.cmd);if(w)out.push(w);if(o.fallback)walk(o.fallback)});walk(steps);return out}
const have=tok=>cmdCache.get(tok)!==false;
function reqOK(req,steps){
  if(req===false||req==='none')return true;
  if(req!=null)return asList(req).map(String).every(x=>!okTok(x)||have(x));
  const tk=autoTokens(steps);return tk.length===0||tk.some(have);
}
function collectTokens(d){
  const s=new Set();const add=x=>asList(x).map(String).forEach(v=>{if(okTok(v))s.add(v)});
  const one=(req,steps)=>{if(req===false||req==='none')return;if(req!=null)add(req);else autoTokens(steps).forEach(v=>s.add(v))};
  (d.pages||[]).forEach(p=>(p.items||[]).forEach(it=>{
    if(it.button)one(it.requires,it.run||(it.reboot?'reboot':null));
    else if(it.progress&&it.run)one(it.requires,it.run);
    else if(it.list){one(it.requires,it.run);(it.columns||[]).forEach(c=>one(c.requires,c.run));(it.actions||[]).forEach(a=>one(a.requires,a.run))}
  }));
  return[...s];
}
async function ensureCmds(tokens){
  const need=tokens.filter(x=>!cmdCache.has(x));if(!need.length)return;
  const r=await exec('for c in '+need.join(' ')+'; do case "$c" in /*) [ -x "$c" ];; *) command -v "$c" >/dev/null 2>&1;; esac && echo "$c 1" || echo "$c 0"; done');
  for(const l of r.output.split('\n')){const m=l.trim().match(/^(\S+) ([01])$/);if(m)cmdCache.set(m[1],m[2]==='1')}
}
function itemAvailable(it){
  if(it.button)return reqOK(it.requires,it.run||(it.reboot?'reboot':null));
  if(it.progress&&it.run)return reqOK(it.requires,it.run);
  if(it.list)return reqOK(it.requires,it.run);
  return true;
}
function pageVisible(p){
  const items=(p.items||[]);const act=items.filter(i=>!i.field);
  return act.length===0||act.some(itemAvailable);
}

/* ---------- подстановка значений и цепочки команд ---------- */
const q=s=>"'"+String(s).replace(/'/g,"'\\''")+"'";
function build(cmd,fields,vars){
  return String(cmd).replace(/\{(\w+)\}/g,(_,n)=>{
    if(vars&&Object.prototype.hasOwnProperty.call(vars,n)){const v=String(vars[n]);if(!/^[A-Za-z0-9._@:+ ,%\/-]*$/.test(v))throw new Error(t('bad_value',n));return v}
    const f=fields[n];if(!f)throw new Error(t('no_field',n));
    const v=f.el.value,lb=f.def.label||n;
    switch(f.def.type){
      case'host':if(!/^[A-Za-z0-9._:-]+$/.test(v))throw new Error(t('bad_host',lb));return v;
      case'number':if(!/^-?\d+$/.test(v))throw new Error(t('bad_num',lb));return v;
      case'choice':return v;
      default:return q(v);
    }
  });
}
const exec=cmd=>invoke('run_command',{command:cmd});
const isSimple=steps=>{const l=asList(steps);return l.length===1&&(typeof l[0]==='string'||!l[0].fallback)};
function shouldRun(st,prev){
  if(!prev)return true;
  const w=st.when||'ok';
  let c=w==='always'?true:w==='failed'?!prev.ok:prev.ok;
  if(st.when_contains!=null)c=c&&prev.out.includes(st.when_contains);
  if(st.when_not_contains!=null)c=c&&!prev.out.includes(st.when_not_contains);
  return c;
}
// Выполняет список шагов. Возвращает {ok,last,log}
async function runSteps(steps,fields,verbose,vars){
  let prev=null,log='';
  for(const raw of asList(steps)){
    const st=typeof raw==='string'?{cmd:raw}:raw;
    if(!shouldRun(st,prev))continue;
    const cmd=build(st.cmd,fields,vars);
    const r=await exec(cmd);
    let ok=r.code===0||r.code===null;
    if(st.ok_if&&!r.output.includes(st.ok_if))ok=false;
    if(st.fail_if&&r.output.includes(st.fail_if))ok=false;
    if(verbose)log+=`$ ${cmd}\n`;
    log+=r.output+(r.output&&!r.output.endsWith('\n')?'\n':'');
    if(!ok&&r.code)log+=t('exit_code',r.code)+'\n';
    prev={ok,out:r.output};
    if(!ok&&st.fallback){const fb=await runSteps(st.fallback,fields,true,vars);log+=fb.log;prev={ok:fb.ok,out:fb.last}}
  }
  return{ok:prev?prev.ok:true,last:prev?prev.out:'',log};
}

/* ---------- перезагрузка устройства и автоматическое переподключение ---------- */
async function rebootFlow(){
  const dlg=$('#rb');let stop=false;
  $('#rb-cancel').onclick=()=>{stop=true};$('#rb-msg').textContent=t('rb_wait');dlg.showModal();
  try{await invoke('disconnect')}catch{}
  const t0=Date.now();await sleep(15000);
  const id=`${sess.f.host}:${sess.f.port}`;
  while(!stop&&Date.now()-t0<600000){
    try{
      await invoke('connect',{host:sess.f.host,port:sess.f.port,user:sess.f.user,password:sess.pw,keyPath:sess.key||null,knownFp:fps[id]||null,trust:false,dns:sess.f.dns||null});
      dlg.close();renderPage();return;
    }catch(e){
      if(String(e).startsWith('KEY:'))break;
      $('#rb-msg').textContent=t('rb_try',Math.round((Date.now()-t0)/1000));await sleep(5000);
    }
  }
  dlg.close();backToLogin();
  $('#login-err').className='err';$('#login-err').textContent=t('rb_lost');
}

/* ---------- реклама: встроена в программу, настраивается только в ads.js ---------- */
function showAd(){
  const slot=$('#ad');slot.replaceChildren();
  if(typeof ADS==='undefined'||!ADS.length)return;
  setTimeout(()=>{ // после отрисовки страницы
    const a=ADS[Math.floor(Math.random()*ADS.length)];
    if(!/^https:\/\//.test(a.url))return;
    const link=el('a',{href:'#'},el('img',{src:a.img,alt:a.alt||'',draggable:'false'}));
    let timer=null,fired=false;
    const copy=()=>{copyText(a.url);toast(t('ad_copied'))};
    link.addEventListener('pointerdown',()=>{fired=false;timer=setTimeout(()=>{fired=true;copy()},600)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>link.addEventListener(ev,()=>clearTimeout(timer)));
    link.addEventListener('click',e=>{e.preventDefault();if(fired){fired=false;return}openUrl(a.url)});
    link.addEventListener('contextmenu',e=>{e.preventDefault();if(!fired)copy()});
    slot.replaceChildren(el('div',{class:'hint'},t('ad')),link);
  },400);
}

/* ---------- таблица из вывода команды (list) ---------- */
const cond=(c,x)=>asList(c).every(k=>{const v=x.v[k.var]??'';
  if(k.is!=null)return v===String(k.is);if(k.is_not!=null)return v!==String(k.is_not);if(k.empty!=null)return (v==='')===!!k.empty;return true});

function renderList(card,it,fields){
  const cols=(it.columns||[]).filter(c=>reqOK(c.requires,c.run));
  const acts=(it.actions||[]).filter(a=>reqOK(a.requires,a.run));
  const flat=[];
  cols.forEach(c=>{const titles=c.titles||[c.title||''],vars=c.vars||(c.var?[c.var]:[]);
    titles.forEach((tt,i)=>flat.push({title:tt,var:vars[i],values:c.values||{},col:c,idx:i,n:titles.length}))});
  const search=el('input',{placeholder:t('search')});
  const flt=it.filter?el('input',{type:'checkbox',style:'width:auto'}):null;
  const info=el('div',{class:'hint',style:'white-space:pre-wrap'});
  const box=el('div',{style:'overflow-x:auto;margin-top:8px'});
  let rows=[];
  card.append(el('b',{},typeof it.list==='string'?it.list:''));
  if(it.search!==false)card.append(search);
  if(flt)card.append(el('label',{style:'display:flex;gap:6px;align-items:center'},flt,it.filter.label||''));
  card.append(el('button',{class:'sec',onclick:refresh},t('refresh')),info,box);
  if(it.hint)card.append(el('div',{class:'hint'},it.hint));
  search.oninput=draw;if(flt)flt.onchange=draw;
  let nameRe=null;try{if(it.name)nameRe=new RegExp(it.name)}catch{}

  async function refresh(){
    info.textContent=t('updating');
    try{
      const r=await runSteps(it.run,fields,false);
      const seen=new Set();rows=[];
      for(const raw of r.last.split('\n')){
        const line=raw.trim();if(!line)continue;
        let nm;if(nameRe){const m=line.match(nameRe);if(!m)continue;nm=m[1]??m[0]}else nm=line.split(/\s+/)[0];
        if(!/^[A-Za-z0-9._@:+-]+$/.test(nm)||seen.has(nm))continue;
        seen.add(nm);rows.push({name:nm,v:{name:nm},raw:[]});
      }
      const names=rows.map(x=>x.name).join(' ');
      for(const c of cols){
        const out=(await runSteps(c.run,fields,false,{names})).last;
        const map={};
        for(const l of out.split('\n')){const m=l.trim().match(/^(\S+)\s*(.*)$/);if(m)map[m[1]]=m[2].trim()}
        flat.forEach((f,fi)=>{if(f.col!==c)return;
          rows.forEach(x=>{const rest=map[x.name]??'';const val=f.n>1?(rest.split(/\s+/)[f.idx]??''):rest;
            x.raw[fi]=val;if(f.var)x.v[f.var]=val})});
      }
      info.textContent=t('list_stats',rows.length);draw();
    }catch(e){info.textContent=errMsg(e)}
  }
  async function act(a,x){
    const vars={...x.v};
    const tpl=s=>String(s).replace(/\{(\w+)\}/g,(m,k)=>k in vars?vars[k]:m);
    if(a.confirm){if(!(await ask(typeof a.confirm==='string'?tpl(a.confirm):t('confirm_default'))))return}
    else if(asList(a.confirm_for).includes(x.name)){if(!(await ask(t('risky',x.name))))return}
    info.textContent=`${x.name}: ${a.label}…`;
    try{
      const r=await runSteps(a.run,fields,false,vars);
      info.textContent=`${x.name}: ${a.label} — `+(r.ok?t('cmd_ok'):t('cmd_fail'))+(r.log.trim()?'\n'+r.log.trim():'');
    }catch(e){info.textContent=`${x.name}: ${errMsg(e)}`}
    setTimeout(refresh,600);
  }
  function draw(){
    const qq=search.value.trim().toLowerCase();
    const tb=el('table'),hd=el('tr');
    hd.append(el('th',{},it.name_title||t('th_name')));flat.forEach(f=>hd.append(el('th',{},f.title)));
    if(acts.length)hd.append(el('th',{},t('th_act')));tb.append(hd);
    rows.filter(x=>(!qq||x.name.toLowerCase().includes(qq))&&(!flt||!flt.checked||x.v[it.filter.var]===String(it.filter.is))).forEach(x=>{
      const tr=el('tr');tr.append(el('td',{},el('b',{},x.name)));
      flat.forEach((f,i)=>{const raw=x.raw[i]||'';tr.append(el('td',{},raw===''?'—':(f.values[raw]??raw)))});
      if(acts.length){const td=el('td');
        acts.forEach(a=>{
          if(a.show_if&&!cond(a.show_if,x))return;
          const p={class:'sm',title:a.hint||'',onclick:()=>act(a,x)};
          if(a.enabled_if&&!cond(a.enabled_if,x))p.disabled='';
          td.append(el('button',p,a.label||'?'));
        });tr.append(td)}
      tb.append(tr);
    });
    box.replaceChildren(tb);
  }
  refresh();
}

/* ---------- источники для полос ---------- */
const SOURCES={ // команды печатают «всего занято» в килобайтах; работают и на BusyBox (OpenWrt)
  memory:{mul:1024,cmd:"awk '/^MemTotal/{t=$2}/^MemAvailable/{a=$2}/^MemFree/{f=$2}END{if(!a)a=f;print t,t-a}' /proc/meminfo"},
  disk:{mul:1024,cmd:"df -kP $([ -d /overlay ] && echo /overlay || echo /) | awk 'NR==2{print $2,$3}'"}
};

/* ---------- отрисовка страницы ---------- */
function renderPage(){
  const page=vpages[curPage];const box=$('#page');box.replaceChildren();
  if(!page){if(doc)box.append(el('div',{class:'card hint'},t('na')));showAd();return}
  const fields={};
  (page.items||[]).forEach(it=>{
    if(!itemAvailable(it))return;
    const card=el('div',{class:'card'});box.append(card);
    if(it.list){renderList(card,it,fields)}
    else if(it.field){
      const type=it.type||'text';let input;
      if(type==='choice'){input=el('select');Object.entries(it.options||{}).forEach(([k,v])=>input.append(el('option',{value:v},k)))}
      else{input=el('input',{type:type==='number'?'number':'text',autocapitalize:'off',autocomplete:'off'});
        if(it.placeholder)input.placeholder=it.placeholder;if(it.default!=null&&it.default!=='')input.value=it.default}
      fields[it.field]={def:{...it,type},el:input};
      card.append(el('label',{},it.label||it.field),input);
    }else if(it.button){
      const out=el('pre',{class:'hide'});
      card.append(el('button',{onclick:async()=>{
        const cf=it.confirm;
        if(it.reboot||cf){if(!(await ask(typeof cf==='string'?cf:it.reboot?t('rb_ask'):t('confirm_default'))))return}
        out.classList.remove('hide');out.textContent=t('run_wait');
        try{
          const steps=it.run||(it.reboot?'reboot':null);const verbose=!isSimple(steps);
          const r=await runSteps(steps,fields,verbose);
          out.textContent=(r.log.trim()||t('empty_out'))+(r.ok?(verbose?'\n'+t('cmd_ok'):''):'\n'+t('cmd_fail'));
          if(it.reboot&&sess)rebootFlow();
        }catch(e){
          if(it.reboot&&sess){out.textContent=t('rb_wait');rebootFlow()}   // обрыв связи при reboot ожидаем
          else out.textContent=errMsg(e);
        }
      }},it.button),out);
    }else if(it.progress){
      const bar=el('progress',{max:100,value:0}),txt=el('div',{},'…');
      const upd=async()=>{
        try{
          txt.className='';let src=null,out;
          if(it.run){out=(await runSteps(it.run,fields,false)).last}
          else{src=(it.source==='disk'&&it.path)?{mul:1024,cmd:`df -kP ${q(it.path)} | awk 'NR==2{print $2,$3}'`}:SOURCES[it.source];
            if(!src)throw new Error(t('bad_src',it.source));out=(await exec(src.cmd)).output}
          const mul=src?src.mul:1;
          const [total,used]=out.trim().split(/\s+/).map(Number);
          if(!total||isNaN(used))throw new Error(t('bad_parse',out));
          const bytes=total*mul;let u=it.unit;if(!u||u==='auto')u=bytes>=1073741824?'GB':bytes>=1048576?'MB':'KB';
          const k=(UNITS[u]||1)/mul,dec=u==='GB'?2:u==='MB'?1:0;
          bar.value=used/total*100;txt.textContent=t('of',(used/k).toFixed(dec),(total/k).toFixed(dec),u,(used/total*100).toFixed(0));
        }catch(e){txt.textContent=e instanceof Error?e.message:errMsg(e);txt.className='err'}
      };
      card.append(el('b',{},it.progress),bar,txt,el('button',{class:'sec',onclick:upd},t('refresh')));upd();
    }
  });
  showAd();
}

(async()=>{await initLangs();applyLang();showAd()})();
